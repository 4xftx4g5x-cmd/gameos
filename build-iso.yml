name: Build GameOS ISO

on:
  workflow_dispatch:
    inputs:
      kernel_v3:
        description: "Kernel otimizado p/ CPUs com AVX2 (Intel Haswell/2013+ ou AMD Ryzen). NÃO inicia em CPU mais antiga."
        type: boolean
        default: false
  push:
    tags: ["v*"]

env:
  # Mude este número para recompilar o kernel linux-hkos (ex.: kernel novo no Arch).
  KERNEL_REV: "2"
  HKOS_KFLAGS: ${{ inputs.kernel_v3 && '-pipe -march=x86-64-v3' || '-pipe' }}
  HKOS_VARIANT: ${{ inputs.kernel_v3 && 'v3' || 'generico' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Restaurar kernel linux-hkos já compilado
        uses: actions/cache/restore@v4
        with:
          path: kcache
          key: hkos-kernel-${{ env.KERNEL_REV }}-${{ env.HKOS_VARIANT }}

      - name: Gerar a ISO (container Arch Linux)
        run: |
          mkdir -p out kcache
          docker run --rm --privileged \
            -v "$PWD":/work \
            -e OUT=/work/out \
            -e KCACHE=/work/kcache \
            -e HKOS_KFLAGS \
            archlinux:latest \
            bash -c "pacman -Syu --noconfirm archiso && bash /work/build.sh"

      - name: Guardar kernel linux-hkos compilado
        if: hashFiles('kcache/*.zst') != ''
        uses: actions/cache/save@v4
        with:
          path: kcache
          key: hkos-kernel-${{ env.KERNEL_REV }}-${{ env.HKOS_VARIANT }}

      - name: Enviar a ISO
        uses: actions/upload-artifact@v4
        with:
          name: gameos-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14

# GameOS - ajustes de memória, agendador e rede para jogos

# Memória (com zram, swap é barato: favorece páginas anônimas na zram)
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500

# Alguns jogos (Hogwarts Legacy, Star Citizen, DayZ...) precisam de muitos mapeamentos
vm.max_map_count = 2147483642

# Kernel
kernel.nmi_watchdog = 0
kernel.split_lock_mitigate = 0
kernel.sched_autogroup_enabled = 1

# Inotify (launchers e engines monitoram muitos arquivos)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Rede (menor latência e melhor throughput)
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

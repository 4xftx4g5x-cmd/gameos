name: Build GameOS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # Mude este número para recompilar o kernel linux-hkos (ex.: kernel novo no Arch).
  KERNEL_REV: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Restaurar kernel linux-hkos já compilado
        uses: actions/cache/restore@v4
        with:
          path: kcache
          key: hkos-kernel-${{ env.KERNEL_REV }}

      - name: Gerar a ISO (container Arch Linux)
        run: |
          mkdir -p out kcache
          docker run --rm --privileged \
            -v "$PWD":/work \
            -e OUT=/work/out \
            -e KCACHE=/work/kcache \
            archlinux:latest \
            bash -c "pacman -Syu --noconfirm archiso && bash /work/build.sh"

      - name: Guardar kernel linux-hkos compilado
        if: hashFiles('kcache/*.zst') != ''
        uses: actions/cache/save@v4
        with:
          path: kcache
          key: hkos-kernel-${{ env.KERNEL_REV }}

      - name: Enviar a ISO
        uses: actions/upload-artifact@v4
        with:
          name: gameos-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
